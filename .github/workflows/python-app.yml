# Non-data unit tests for nornir-imageregistration (no large TESTINPUTPATH corpus).

name: Python application

on:
  push:
    branches: [ "master", "dev", "cpu_only" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CURSES: "False"
  TERM: xterm
  ECLIPSE: ECLIPSE
  NORNIR_HEADLESS: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        python -m pip install pytest "numpy>=2.2.0" "scipy>=1.11" "matplotlib>=3.10" "Pillow>=10.2" "pydantic>=2.9.2" "six>=1.16" "scikit-image>=0.25.1" "hypothesis>=6.96"
        python -m pip install "nornir_shared @ git+https://github.com/jamesra/nornir-shared.git@dev"
        python -m pip install "nornir_pools @ git+https://github.com/jamesra/nornir-pools.git@master" --no-deps
        python -m pip install . --no-deps
        python -c "import numpy; import nornir_imageregistration; print('install ok', numpy.__version__)"

    - name: Create test data folders (Unix)
      if: runner.os != 'Windows'
      run: |
        mkdir -p ${{ github.workspace }}/testdata ${{ github.workspace }}/testdata_output
        echo "TESTINPUTPATH=${{ github.workspace }}/testdata" >> $GITHUB_ENV
        echo "TESTOUTPUTPATH=${{ github.workspace }}/testdata_output" >> $GITHUB_ENV

    - name: Create test data folders (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir -p ${{ github.workspace }}\testdata
        mkdir -p ${{ github.workspace }}\testdata_output
        echo "TESTINPUTPATH=${{ github.workspace }}\testdata" >> $env:GITHUB_ENV
        echo "TESTOUTPUTPATH=${{ github.workspace }}\testdata_output" >> $env:GITHUB_ENV

    - name: Run unit tests
      run: >
        python -m pytest -q
        tests/test_grid_division.py
        tests/spatial/
        tests/test_stosfile_paths.py
        tests/test_gen_random_data_dtype.py
        tests/test_tile_overlap.py
        tests/test_transformed_image_data_contracts.py
        tests/test_assemble_phase2.py
        tests/test_assemble_preload.py
        tests/test_volume.py
        tests/transforms/test_registrationtree.py
        tests/transforms/test_points_to_linear_fit.py
        tests/transforms/test_linearfit.py
        tests/transforms/test_transform_conversion.py
        tests/transforms/test_scale_translate_registration.py
