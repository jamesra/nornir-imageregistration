[build-system]
requires = ["setuptools >= 61.0"]
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
where = ["."]
include = ["nornir_imageregistration*"]

[project]
name = "nornir_imageregistration"
version = "1.6.5"
authors = [
    { name = "James Anderson", email = "James.R.Anderson@utah.edu" },
]
description = "Contains the core image registration algorithms for aligning 2d images into larger mosaics and 3D volumes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "numpy >= 2.2.0",
    "scipy >= 1.11",
    "matplotlib >= 3.10",
    "Pillow >= 10.2",
    "pydantic >= 2.9.2",
    "six >= 1.16",
    "scikit-image >= 0.25.1",
    "hypothesis >= 6.96",
    "nornir_pools @ git+https://github.com/jamesra/nornir-pools.git@master",
    "nornir_shared @ git+https://github.com/jamesra/nornir-shared.git@dev",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
nornir-addtransforms = "nornir_imageregistration.scripts.nornir_addtransforms:Execute"
nornir-assemble-tiles = "nornir_imageregistration.scripts.nornir_assemble_tiles:Execute"
nornir-assemble = "nornir_imageregistration.scripts.nornir_assemble:Execute"
nornir-rotate-transalate = "nornir_imageregistration.scripts.nornir_rotate_translate:Execute"
nornir-slice-to-mosaic = "nornir_imageregistration.scripts.nornir_slicetomosaic:Execute"
nornir-translatemosaic = "nornir_imageregistration.scripts.nornir_translatemosaic:Execute"
nornir-scaletransform = "nornir_imageregistration.scripts.nornir_scaletransform:Execute"
nornir-stos-grid-refinement = "nornir_imageregistration.scripts.nornir_stos_grid_refinement:Execute"
nornir-show-mosaic-layout = "nornir_imageregistration.scripts.nornir_show_mosaic_layout:Execute"
nornir-blob-filter = "nornir_imageregistration.scripts.nornir_blob_filter:Execute"
nornir-blob-benchmark = "nornir_imageregistration.scripts.nornir_blob_benchmark:Execute"

[project.optional-dependencies]
gpu = ["cupy >= 13.0"]
# CuVS: GPU pairwise cdist always; NN search only at ≥4096 points (2D cKDTree below). Linux; match CUDA major to cupy-cudaNx.
gpu_cuvs = ["cupy >= 13.0", "cuvs-cu13"]
mkl = ["mkl_fft >= 1.3.11",
    "mkl_random >= 1.2.8",
    "mkl_service >= 2.4.2"]
typing = ["scipy-stubs"]

[project.urls]
Homepage = "https://github.com/jamesra/nornir-imageregistration"
Issues = "https://github.com/jamesra/nornir-imageregistration/issues"

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
# Declared here as well as in the umbrella pytest.ini: this section shadows that file when
# pytest is invoked from inside the submodule, which is how the per-file verification runs
# are done. Declaring it only upstream left `-m "not slow"` warning about an unknown mark
# in exactly the runs that need it.
markers = [
    "slow: measured to need far longer than a routine-verification budget; deselect with -m \"not slow\". See tests/test_SliceToSliceBrute_budget.py and review #229.",
]
